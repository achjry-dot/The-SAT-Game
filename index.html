<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so the canvas reaches under a notch rather than being
     letterboxed beside it; the game draws its own margins and never puts a
     control in the outermost few percent. maximum-scale pins the page so a
     double-tap cannot zoom the canvas out of alignment with the pointer
     coordinates every hit test is computed from. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>THE SAT GAME</title>
<style>
  html,body{
    margin:0;padding:0;width:100%;height:100%;
    background:#000;overflow:hidden;
    /* the whole page participates in the aesthetic; nothing should ever smooth */
    /* Order matters: later declarations win. `crisp-edges` is the older
       keyword and must come FIRST so that `pixelated` overrides it wherever
       it is understood. Written the other way round - as this was - every
       engine that supports both silently used crisp-edges instead. */
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    -webkit-font-smoothing:none;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
    /* Stops the rubber-band bounce past the top and bottom on iOS, which on a
       full-screen canvas reads as the whole game sliding off its own page. */
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:fixed;inset:0;
    display:block;
    width:100%;height:100%;
    background:#000;
    /* Order matters: later declarations win. `crisp-edges` is the older
       keyword and must come FIRST so that `pixelated` overrides it wherever
       it is understood. Written the other way round - as this was - every
       engine that supports both silently used crisp-edges instead. */
    image-rendering:crisp-edges;
    image-rendering:pixelated;
    cursor:none;
  }
  /* Shown only when WebGL2 is unavailable. Styled to match the game's title card. */
  #fatal{
    position:fixed;inset:0;display:none;
    place-content:center;place-items:center;
    background:#000;color:#cfc8bd;
    font:16px/1.6 "Courier New",monospace;
    letter-spacing:2px;text-align:center;padding:32px;
    text-transform:uppercase;
  }
  #fatal b{display:block;font-size:26px;margin-bottom:18px;letter-spacing:6px}
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="fatal">
    <div>
      <b>Signal Lost</b>
      This machine reports no WebGL2 device.<br>
      Try a current Chrome, Edge, or Firefox build.
    </div>
  </div>

<!--
  Load order is meaningful: every file hangs its exports off the global SATG
  namespace, and later files read earlier ones at definition time.
  No bundler, no modules, no network fetches - so this runs from file:// as
  happily as it does from a web host.
-->
<script src="src/core/util.js"></script>
<script src="src/config.js"></script>
<script src="src/core/gl.js"></script>
<script src="src/core/shaders.js"></script>
<script src="src/core/textures.js"></script>
<script src="src/core/geometry.js"></script>
<script src="src/core/font-data.js"></script>
<script src="src/core/font.js"></script>
<script src="src/render/pipeline.js"></script>
<script src="src/audio/audio.js"></script>
<script src="src/audio/music.js"></script>
<script src="src/sat/util.js"></script>
<script src="src/sat/taxonomy.js"></script>
<script src="src/sat/math-questions.js"></script>
<script src="src/sat/verbal-questions.js"></script>
<script src="src/sat/question-bank.js"></script>
<script src="src/sat/exam.js"></script>
<script src="src/sat/profile.js"></script>
<script src="src/net/cloud.js"></script>
<script src="src/ui/touch.js"></script>
<script src="src/ui/paper.js"></script>
<script src="src/ui/calculator.js"></script>
<script src="src/ui/fx.js"></script>
<script src="src/ui/menu.js"></script>
<script src="src/ui/screens.js"></script>
<script src="src/ui/escmenu.js"></script>
<script src="src/ui/results.js"></script>
<script src="src/ui/analysis.js"></script>
<script src="src/ui/printdoc.js"></script>
<script src="src/ui/typepicker.js"></script>
<script src="src/ui/settings.js"></script>
<script src="src/ui/account.js"></script>
<script src="src/ui/stats.js"></script>
<script src="src/ui/feedback.js"></script>
<!-- corridor.js before scene.js: the exam room hangs the same 957 plate on the
     door behind the seat that the corridor hangs on the outside of it, and
     takes the generator from there. machine.js before scene.js for the same
     reason - the scene builds one in its constructor. -->
<script src="src/world/corridor.js"></script>
<script src="src/world/machine.js"></script>
<script src="src/world/scene.js"></script>
<script src="src/game/cinematic.js"></script>
<script src="src/game/game.js"></script>
<script src="src/main.js"></script>
</body>
</html>
